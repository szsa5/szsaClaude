<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comment Desk</title>
<!-- The Comment Desk page (dev-comments skill, /comment-desk), served by desk.mjs serve. Sources, names and labels come from the project's .comment-desk.json. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #111010; --panel: #191817; --panel2: #211f1e; --hover: #242220; --ink: #efeae3; --muted: #9d958b; --line: #2e2b28;
    --acc: #f98829; --acc-soft: rgba(249, 136, 41, .14);
    --new: #f98829; --claude: #7eaaff; --dev: #b596ff; --stg: #6fc28b; --wait: #e2b54c; --done: #7d766d;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 Montserrat, "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; }
  a { color: inherit; }

  /* top bar */
  .bar { flex: none; display: flex; align-items: center; gap: 18px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar h1 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: .01em; }
  .tabs { display: flex; gap: 4px; }
  .tab { border: 0; background: none; padding: 6px 12px; border-radius: 7px; color: var(--muted); font-weight: 600; font-size: 13px; }
  .tab .n { font-family: var(--mono); font-size: 11px; margin-left: 6px; opacity: .8; }
  .tab[aria-selected="true"] { background: var(--panel2); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  .bar .sp { flex: 1; }
  .who { font-size: 12px; color: var(--muted); }
  .who b { color: var(--ink); }
  .live { width: 7px; height: 7px; border-radius: 50%; background: var(--stg); display: inline-block; margin-right: 6px; vertical-align: 1px; }
  .live.off { background: #d9534f; }
  .errors { flex: none; background: rgba(217, 83, 79, .15); color: #f0a09d; padding: 8px 18px; font-size: 13px; border-bottom: 1px solid var(--line); }

  /* three columns */
  .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 380px) 1fr minmax(220px, 280px); }
  .col { min-height: 0; overflow: auto; border-right: 1px solid var(--line); }
  .col:last-child { border-right: 0; }

  /* list */
  .filters { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .chip { border: 0; padding: 4px 10px; border-radius: 99px; background: var(--panel2); color: var(--muted); font-size: 12px; font-weight: 600; }
  .chip .n { font-family: var(--mono); font-size: 11px; margin-left: 4px; }
  .chip[aria-pressed="true"] { background: var(--acc-soft); color: var(--acc); }
  .item { width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 2px 10px; padding: 11px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; }
  .item:hover { background: var(--hover); }
  .item[aria-current="true"] { background: var(--acc-soft); }
  .num { grid-row: span 2; width: 28px; height: 28px; border-radius: 14px 14px 14px 3px; background: var(--acc); color: #1a1714; font: 700 11px/28px Montserrat, sans-serif; text-align: center; }
  .item.resolved .num { background: var(--done); }
  .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--muted); min-width: 0; }
  .item .m .when { flex: none; font-variant-numeric: tabular-nums; }
  .item .m .route { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
  .lane { flex: none; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
  .lane[data-lane="new"] { --c: var(--new); } .lane[data-lane="claude"] { --c: var(--claude); } .lane[data-lane="dev"] { --c: var(--dev); }
  .lane[data-lane="staging"] { --c: var(--stg); } .lane[data-lane="waiting"] { --c: var(--wait); } .lane[data-lane="resolved"] { --c: var(--done); }
  .empty { padding: 28px 18px; color: var(--muted); }

  /* thread */
  .thread { padding: 22px 28px 40px; display: flex; flex-direction: column; gap: 18px; max-width: 820px; }
  .thead { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .thead h2 { margin: 0; font-size: 20px; }
  .thead .route { font-family: var(--mono); font-size: 12px; color: var(--acc); }
  .thead .vp { font-size: 12px; color: var(--muted); }
  .links { display: flex; gap: 14px; font-size: 12.5px; }
  .links a { color: var(--muted); text-decoration: none; }
  .links a:hover { color: var(--ink); }
  .msgs { display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 68ch; }
  .msg .by { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg .by b { color: var(--ink); }
  .msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.owner { padding-left: 12px; border-left: 2px solid var(--acc); }
  .msg.claude { padding-left: 12px; border-left: 2px solid var(--claude); }
  .msg.claude .by b { color: var(--claude); }
  .note { border-radius: 10px; padding: 12px 14px; background: color-mix(in srgb, var(--claude) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--claude) 25%, transparent); }
  .note .by { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--claude); margin-bottom: 4px; }
  .note p { margin: 0; white-space: pre-wrap; }
  .shots { display: flex; gap: 12px; flex-wrap: wrap; }
  .shots a { display: block; width: 180px; text-decoration: none; }
  .shots small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .shots img { width: 180px; height: 150px; object-fit: cover; object-position: top; border-radius: 6px; border: 1px solid var(--line); display: block; background: var(--panel2); }

  .composer { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .composer textarea { width: 100%; min-height: 64px; max-height: 50vh; resize: none; border: 0; outline: none; background: none; color: var(--ink); font: 14px/1.5 Montserrat, sans-serif; field-sizing: content; }
  .composer textarea::placeholder { color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .row .sp { flex: 1; }
  .btn { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); font-weight: 600; font-size: 13px; }
  .btn:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.pri { background: var(--acc); border-color: var(--acc); color: #1a1714; }
  .btn.ghost { background: none; }
  .hint { font-size: 12px; color: var(--muted); }
  .preview { border-radius: 10px; border: 1px solid color-mix(in srgb, var(--acc) 45%, transparent); background: var(--acc-soft); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .preview .lbl { font-size: 12px; font-weight: 600; color: var(--acc); }
  .preview blockquote { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--panel); white-space: pre-wrap; }
  .readonly { font-size: 12.5px; color: var(--muted); }

  /* feed */
  .side { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .side h3 { margin: 0; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .feed { display: flex; flex-direction: column; gap: 10px; font-size: 12.5px; }
  .feed div { border-left: 2px solid var(--claude); padding-left: 10px; }
  .feed time { display: block; color: var(--muted); font-size: 11px; }

  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 13px; display: flex; gap: 12px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
  .toast[hidden] { display: none; }
  .toast button { border: 0; background: none; color: var(--acc); font-weight: 700; padding: 0; }
  .blank { padding: 60px 28px; color: var(--muted); }

  @media (max-width: 1100px) { .main { grid-template-columns: minmax(280px, 340px) 1fr; } .main > .col.side { display: none; } }
  @media (max-width: 720px) { .main { grid-template-columns: 1fr; } .main > .col.thread-col { display: none; } .main.reading > .col.list-col { display: none; } .main.reading > .col.thread-col { display: block; } .back { display: inline-flex !important; } }
  .back { display: none; }

  /* two rooms: the comment thread on a white card like the overlay's own card (for a public source, what its
     audience reads), the private workbench on dark blue. The card can move into a left column beside the workbench
     and back (remembered). */
  .thread.wide { max-width: none; }
  .rooms { display: flex; flex-direction: column; gap: 22px; }
  .rooms.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .room { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .rlabel { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); min-height: 28px; }
  .rlabel svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .rlabel .sp { flex: 1; }
  .room.private .rlabel { color: var(--claude); }
  .pop { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: 600 11px Montserrat, sans-serif; letter-spacing: 0; text-transform: none; }
  .pop:hover { color: var(--ink); border-color: var(--muted); }
  .pop svg { width: 13px; height: 13px; }
  .paper { background: #ffffff; color: #161616; border-radius: 12px; box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 18px 40px rgba(0,0,0,.35); overflow: hidden; }
  .phead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #eee; }
  .pin { background: #2f7cff; color: #fff; font-weight: 700; font-size: 12px; padding: 2px 8px; border-radius: 10px 10px 10px 3px; }
  .proute { font-family: var(--mono); font-size: 11px; color: #777; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pmsgs { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
  .pmsg .by { font-size: 11px; color: #777; }
  .pmsg .by b { color: #161616; }
  .pmsg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pmsg.mine { padding-left: 10px; border-left: 2px solid #f98829; }
  .pcomposer { border-top: 1px solid #eee; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .pcomposer textarea { width: 100%; min-height: 56px; max-height: 40vh; resize: none; border: 1px solid #ddd; border-radius: 8px; background: #fafafa; color: #161616; padding: 8px 10px; font: 14px/1.5 Montserrat, sans-serif; outline: none; field-sizing: content; }
  .pcomposer textarea:focus { border-color: #2f7cff; background: #fff; }
  .paper .btn { background: #fff; border-color: #ddd; color: #161616; }
  .paper .btn:hover { border-color: #999; }
  .paper .btn.pri { background: #f98829; border-color: #f98829; color: #1a1714; }
  .paper .hint { color: #888; }
  .paper .preview { margin: 0 14px 14px; background: #fff4ea; border-color: #f5c69b; }
  .paper .preview blockquote { background: #fff; border: 1px solid #eee; }
  .paper .readonly { padding: 0 14px 14px; color: #888; }
  .bench { border-radius: 12px; background: #16181d; border: 1px solid #263048; padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; }
  .bmsg .by { font-size: 11px; color: #7d8aa5; }
  .bmsg .by b { color: var(--claude); }
  .bmsg p { margin: 0; white-space: pre-wrap; }
  .bench .shots img { border-color: #263048; background: #1d2027; }
  .bstatus { border-radius: 8px; background: rgba(126,170,255,.08); padding: 8px 10px; }
  .bstatus span { display: block; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #7d8aa5; }
  .bstatus p { margin: 0; white-space: pre-wrap; }
  .chat { display: flex; flex-direction: column; gap: 10px; }
  .cmsg { max-width: 88%; border-radius: 12px; padding: 8px 11px; }
  .cmsg .by { font-size: 11px; color: #7d8aa5; }
  .cmsg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmsg.me { align-self: flex-end; background: #262a33; border-radius: 12px 12px 4px 12px; }
  .cmsg.me .by b { color: var(--ink); }
  .cmsg.claude { align-self: flex-start; background: #1b2436; border: 1px solid #263a5c; border-radius: 12px 12px 12px 4px; }
  .cmsg.claude .by b { color: var(--claude); }
  .cimgs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .cimgs img { display: block; max-width: 200px; max-height: 140px; border-radius: 6px; border: 1px solid #263048; }
  .pimg { position: relative; }
  .pimg button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 14px; line-height: 22px; padding: 0; }
  .working { align-self: flex-start; font-size: 12px; color: var(--claude); }
  .ask { border: 1px solid #263048; border-radius: 10px; background: #111317; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .ask textarea { width: 100%; min-height: 48px; max-height: 40vh; resize: none; border: 0; outline: none; background: none; color: var(--ink); font: 14px/1.5 Montserrat, sans-serif; field-sizing: content; }
  .ask textarea::placeholder { color: #7d8aa5; }
  .ask:focus-within { border-color: var(--claude); }
  .btn.claude { background: var(--claude); border-color: var(--claude); color: #10141c; }
  @media (max-width: 1100px) { .rooms.split { grid-template-columns: 1fr; } }
  /* phones */
  @media (max-width: 720px) {
    .bar { flex-wrap: wrap; gap: 8px 12px; padding: 10px 14px; }
    .bar .sp { display: none; }
    .tabs { order: 3; width: 100%; overflow-x: auto; }
    .tab { flex: none; }
    .who { margin-left: auto; }
    .thread { padding: 14px 14px 32px; gap: 14px; }
    .thead h2 { font-size: 18px; }
    .thead .vp { display: none; }
    .rooms, .rooms.split { display: flex; flex-direction: column; gap: 16px; }
    .pop { display: none; }
    .pcomposer textarea, .ask textarea { font-size: 16px; }
    .shots a, .shots img { width: 46vw; max-width: 180px; }
    .cmsg { max-width: 94%; }
    .row .hint { display: none; }
    .item { padding: 12px 14px; }
    .toast { width: calc(100vw - 28px); justify-content: space-between; }
  }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
  /* Gallery: every picture in one workbench, full screen, ←/→ to step, Esc to close (
     in a focused gallery like view (per workbench)"). */
  .gal { position: fixed; inset: 0; z-index: 100; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: rgba(8,10,14,.97); color: #e8ecf4; }
  .gal[hidden] { display: none; }
  .gal-top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; font-size: 13px; color: #9aa6bd; }
  .gal-top b { color: #e8ecf4; font-weight: 700; }
  .gal-top .sp { flex: 1; }
  .gal button { font: inherit; color: #e8ecf4; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .gal button:hover { background: rgba(255,255,255,.16); }
  .gal-stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; padding: 0 64px; }
  /* A tall full-page screenshot must fit whole: capped by the viewport, not by the (content-sized) row. */
  .gal-stage img { max-width: 100%; max-height: calc(100vh - 200px); object-fit: contain; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #1d2027; }
  .gal-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; padding: 0 !important; font-size: 20px; }
  .gal-nav.prev { left: 12px; } .gal-nav.next { right: 12px; }
  .gal-cap { padding: 12px 18px 16px; text-align: center; font-size: 14px; line-height: 1.45; color: #c8d0df; max-width: 900px; margin: 0 auto; white-space: pre-wrap; }
  .gal-strip { display: flex; gap: 8px; justify-content: center; padding: 0 18px 16px; overflow-x: auto; }
  .gal-strip img { width: 72px; height: 52px; object-fit: cover; object-position: top; border-radius: 4px; border: 2px solid transparent; opacity: .55; cursor: pointer; flex: none; }
  .gal-strip img[aria-current="true"] { border-color: #7eaaff; opacity: 1; }
  .bench img { cursor: zoom-in; }
</style>
</head>
<body>
  <header class="bar">
    <h1>Comment Desk</h1>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <span class="sp"></span>
    <span class="who"><span class="live" id="live"></span><span id="me"></span></span>
  </header>
  <div class="errors" id="errors" hidden></div>
  <div class="main" id="main">
    <div class="col list-col"><div class="filters" id="filters"></div><div id="list"></div></div>
    <div class="col thread-col"><div class="thread" id="thread"><div class="blank">Pick a comment on the left.</div></div></div>
    <aside class="col side"><h3>Claude</h3><div class="feed" id="feed"></div></aside>
  </div>
  <div class="toast" id="toast" hidden></div>

<script>
// BASE: '' on the Mac (desk.mjs), the hidden path on the staging copy (comment-desk.php sets window.DESK_BASE)
const BASE = window.DESK_BASE || '';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// exact local date and time ("29 Sep 2026, 14:24"); the full time with seconds on hover
const when = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }); };   // the exact time, local
const LANES = [['all', 'All open'], ['new', 'New'], ['claude', 'With Claude'], ['dev', 'On dev'], ['staging', 'On staging'], ['waiting', 'Waiting'], ['resolved', 'Resolved']];
const LANE_NAME = Object.fromEntries(LANES);
let ME_NAMES = [];
const srcOf = (id) => (data ? data.sources.find((x) => x.id === id) : null) || {};

let data = null, lastJson = '', src = '', filter = 'all', sel = { staging: null, local: null };
const drafts = {}, previewing = {}, asks = {}, pasted = {};
let split = false;
try { split = localStorage.getItem('desk.split') === '1'; } catch {}
try { const s = JSON.parse(localStorage.getItem('desk.view') || '{}'); src = s.src || src; filter = s.filter || filter; sel = Object.assign(sel, s.sel || {}); } catch {}
const saveView = () => { try { localStorage.setItem('desk.view', JSON.stringify({ src, filter, sel })); } catch {} };

/** Where a comment stands. Claude's note sets the lane until the commenter writes again; otherwise the last word decides. */
function laneOf(c, s) {
  if (c.status === 'resolved') return 'resolved';
  const chat = (data.chat || {})[s + ':' + c.id] || [];
  if (chat.some((m) => m.by !== 'Claude' && m.status !== 'answered')) return 'claude';
  const note = (data.notes[s] || {})[c.id];
  const msgs = [{ by: c.author, at: c.createdAt }, ...(c.replies || [])];
  const isOwner = (by) => (srcOf(s).audience ? !ME_NAMES.includes(by) && by !== 'Claude' : by === c.author);
  const lastOwner = msgs.filter((m) => isOwner(m.by)).map((m) => m.at).sort().pop() || c.createdAt;
  if (note && note.lane && (!note.at || note.at >= lastOwner)) return note.lane;
  const last = msgs[msgs.length - 1];
  if (srcOf(s).audience && ME_NAMES.includes(last.by)) return 'waiting';
  return 'new';
}
const list = (s) => (data && data.comments[s]) || [];
const openCount = (s) => list(s).filter((c) => c.status !== 'resolved').length;

async function load(fresh) {
  try {
    const r = await fetch(BASE + '/api/state' + (fresh ? '?fresh' : ''), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const json = await r.text();
    $('#live').classList.remove('off');
    if (json === lastJson) return;   // nothing changed: leave the page (and whatever is being typed) alone
    lastJson = json; data = JSON.parse(json);
    // comments were written by browsers (or a remote site): the numbers that go into the page unescaped must be numbers
    for (const s of Object.keys(data.comments || {})) data.comments[s] = (Array.isArray(data.comments[s]) ? data.comments[s] : []).filter((c) => c && Number.isInteger(Number(c.id))).map((c) => Object.assign(c, { id: Number(c.id), status: c.status === 'resolved' ? 'resolved' : 'open' }));
    ME_NAMES = [data.me];
    if (!data.sources.some((x) => x.id === src)) src = data.sources[0] ? data.sources[0].id : '';
    document.title = 'Comment Desk · ' + data.project;
    $('#errors').hidden = !data.errors.length; $('#errors').textContent = data.errors.join(' · ');
    render();
  } catch (e) { $('#live').classList.add('off'); }
}

function render() {
  $('#me').innerHTML = `<b>${esc(data.project)}</b> · ${esc(data.me)}`;
  $('#tabs').innerHTML = data.sources.map((x) => `<button class="tab" role="tab" data-src="${esc(x.id)}" aria-selected="${x.id === src}">${esc(x.label)}<span class="n">${openCount(x.id)}</span></button>`).join('');
  // filters with counts
  const lanes = list(src).map((c) => laneOf(c, src));
  const count = (k) => (k === 'all' ? lanes.filter((l) => l !== 'resolved').length : lanes.filter((l) => l === k).length);
  $('#filters').innerHTML = LANES.filter(([k]) => k === 'all' || k === 'resolved' || count(k)).map(([k, name]) => `<button class="chip" data-f="${k}" aria-pressed="${filter === k}">${name}<span class="n">${count(k)}</span></button>`).join('');
  // list: newest activity first
  const shown = list(src).map((c) => ({ c, lane: laneOf(c, src), last: [c.createdAt, ...(c.replies || []).map((r) => r.at)].sort().pop() }))
    .filter((x) => (filter === 'all' ? x.lane !== 'resolved' : x.lane === filter))
    .sort((a, b) => (a.last < b.last ? 1 : -1));
  $('#list').innerHTML = shown.length ? shown.map(({ c, lane, last }) => `<button class="item ${c.status}" data-id="${c.id}" aria-current="${sel[src] === c.id}"><span class="num">${c.id}</span><span class="t">${esc(c.text)}</span><span class="m"><span class="lane" data-lane="${lane}">${LANE_NAME[lane]}</span><span class="when">${when(last)}</span><span class="route">${esc(c.page || '')}</span></span></button>`).join('')
    : `<div class="empty">${filter === 'all' ? 'Nothing open here.' : 'Nothing in “' + LANE_NAME[filter] + '”.'}</div>`;
  renderThread();
  $('#feed').innerHTML = data.feed.length ? data.feed.map((f) => `<div><time>${when(f.at)}</time>${esc(f.text)}</div>`).join('') : '<span class="hint">Nothing yet.</span>';
}

function renderThread() {
  const c = list(src).find((x) => x.id === sel[src]);
  const el = $('#thread');
  if (!c) { el.innerHTML = '<div class="blank">Pick a comment on the left.</div>'; return; }
  const key = src + c.id;
  const active = document.activeElement && ['reply', 'ask'].includes(document.activeElement.id) ? document.activeElement : null;
  if (active) (active.id === 'reply' ? drafts : asks)[key] = active.value;
  const lane = laneOf(c, src);
  const note = (data.notes[src] || {})[c.id];
  const vp = c.viewport ? `${c.viewport.w}×${c.viewport.h}` : '';
  const at = (c.url || c.page || '/').split('#')[0];
  // a link to the comment's page on a site we know, never elsewhere: `site + url` with a url of "@evil.example/…"
  // is a link to evil.example (userinfo), and the url is whatever the commenter's browser sent
  const onSite = (site, path) => { try { const u = new URL(path[0] === '/' && path[1] !== '/' && !path.includes('\\') ? path : '/', site); return u.origin === new URL(site).origin ? u.href : site; } catch { return site; } };
  const S = srcOf(src);
  const pub = !!S.audience, who = S.audience || '';
  const localSite = (data.sources.find((x) => !x.audience && x.site) || {}).site;
  const links = [S.site ? `<a href="${esc(onSite(S.site, at))}#dc=${c.id}" target="_blank" rel="noopener noreferrer">Open the page ↗</a>` : '',
    pub && localSite ? `<a href="${esc(onSite(localSite, at))}" target="_blank" rel="noopener noreferrer">Same page locally ↗</a>` : ''].join('');
  const msgs = [{ by: c.author, at: c.createdAt, text: c.text }, ...(c.replies || [])].map((m) => `<div class="pmsg ${ME_NAMES.includes(m.by) ? 'mine' : ''}"><div class="by"><b>${esc(m.by)}</b> · ${when(m.at)}</div><p>${esc(m.text)}</p></div>`).join('');
  const shots = c.shots && (c.shots.before || c.shots.now) ? `<div class="shots">${c.shots.before ? `<a href="${BASE}/shot/${src}/${c.id}/before" target="_blank"><small>Before</small><img src="${BASE}/shot/${src}/${c.id}/before" alt="Screenshot before"></a>` : ''}${c.shots.now ? `<a href="${BASE}/shot/${src}/${c.id}" target="_blank"><small>Last shot</small><img src="${BASE}/shot/${src}/${c.id}" alt="Screenshot now"></a>` : ''}</div>` : '';
  const resolved = c.status === 'resolved';
  const pv = previewing[key];
  const composer = pv ? `<div class="preview"><span class="lbl">${pub ? esc(who) + ' will read this, signed ' + esc(data.me) + ':' : 'Your reply:'}</span><blockquote>${esc(pv)}</blockquote><div class="row"><button class="btn pri" data-a="send">${pub ? 'Send to ' + esc(who) : 'Add reply'}</button><button class="btn ghost" data-a="edit">Keep editing</button></div></div>`
    : `<div class="pcomposer"><textarea id="reply" placeholder="${pub ? 'Reply to ' + esc(who) + '. Signed ' + esc(data.me) + '.' : 'A note on your own comment.'}">${esc(drafts[key] || '')}</textarea><div class="row"><button class="btn" data-a="${resolved ? 'reopen' : 'resolve'}">${resolved ? 'Reopen' : 'Resolve'}</button><span class="hint">${resolved ? '' : 'Resolves without a message.'}</span><span class="sp"></span><button class="btn pri" data-a="preview" ${drafts[key] && drafts[key].trim() ? '' : 'disabled'}>${pub ? 'Reply as ' + esc(data.me) + '…' : 'Reply…'}</button></div></div>`;
  const chat = (data.chat || {})[src + ':' + c.id] || [];
  const img = (f) => `<a href="${BASE}/upload/${esc(f)}" target="_blank" rel="noreferrer"><img src="${BASE}/upload/${esc(f)}" alt="Image"></a>`;
  const lastMine = [...chat].reverse().find((m) => m.by !== 'Claude');
  const waitingOn = lastMine && lastMine.status !== 'answered' ? (lastMine.status === 'seen' ? 'Claude is on it…' : lastMine.status === 'held' ? 'Waiting for your OK on Telegram: send the code you got there.' : 'Sent. Claude picks it up in a few seconds.') : '';
  const chatHtml = chat.length ? `<div class="chat">${chat.map((m) => `<div class="cmsg ${m.by === 'Claude' ? 'claude' : 'me'}"><div class="by"><b>${esc(m.by)}</b> · ${when(m.at)}</div>${m.text ? `<p>${esc(m.text)}</p>` : ''}${(m.images || []).length ? `<div class="cimgs">${m.images.map(img).join('')}</div>` : ''}</div>`).join('')}${waitingOn ? `<div class="working">${esc(waitingOn)}</div>` : ''}</div>` : '';
  const pastedNow = pasted[key] || [];
  const askBox = `<div class="ask"><textarea id="ask" placeholder="Tell Claude what to change, or ask a question. Paste screenshots.${pub ? ' ' + esc(who) + ' never sees this.' : ''}">${esc(asks[key] || '')}</textarea>${pastedNow.length ? `<div class="cimgs">${pastedNow.map((d, i) => `<span class="pimg"><img src="${d}" alt="Pasted image"><button type="button" data-a="unpaste" data-i="${i}" aria-label="Remove image">×</button></span>`).join('')}</div>` : ''}<div class="row"><span class="hint">⌘ Enter sends</span><span class="sp"></span><button class="btn claude" data-a="ask" ${(asks[key] || '').trim() || pastedNow.length ? '' : 'disabled'}>Send to Claude</button></div></div>`;
  const eye = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const lock = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const popIcon = split ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16M4 15h16"/></svg>' : '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M10 4v16"/></svg>';
  el.innerHTML = `<div class="thead"><button class="btn ghost back" data-a="back">← All</button><h2>#${c.id}</h2><span class="lane" data-lane="${lane}">${LANE_NAME[lane]}</span><span class="route">${esc(c.page || '')}</span><span class="vp">${esc(vp)}${c.element ? ' · ' + esc(c.element.label || '') : ''}</span></div>
    <div class="links">${links}</div>
    <div class="rooms ${split ? 'split' : ''}">
      <section class="room public">
        <div class="rlabel">${eye}<span>${esc(S.room || (pub ? who + ' sees this' : S.label + ' · only you'))}</span><span class="sp"></span><button class="pop" data-a="pop" title="${split ? 'Put back above the workbench' : 'Move to the left, beside the workbench'}" aria-label="${split ? 'Stack the rooms' : 'Side by side'}">${popIcon}<span>${split ? 'Stack' : 'Side by side'}</span></button></div>
        <div class="paper">
          <div class="phead"><span class="pin">#${c.id}</span><span class="proute">${esc(c.page || '')}${vp ? ' · ' + esc(vp) : ''}</span></div>
          <div class="pmsgs">${msgs}</div>
          ${composer}
        </div>
      </section>
      <section class="room private">
        <div class="rlabel">${lock}<span>Workbench · only you and Claude</span></div>
        <div class="bench">
          ${note && note.text ? `<div class="bstatus"><span>Where it stands · ${when(note.at)}</span><p>${esc(note.text)}</p></div>` : ''}
          ${shots}
          ${chatHtml}
          ${askBox}
        </div>
      </section>
    </div>`;
  el.classList.toggle('wide', split);
  const ask = $('#ask');
  if (ask) {
    const btn = el.querySelector('[data-a="ask"]');
    ask.addEventListener('input', () => { asks[key] = ask.value; btn.disabled = !ask.value.trim() && !(pasted[key] || []).length; });
    ask.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); sendAsk(); } });
    ask.addEventListener('paste', (e) => {
      const files = [...(e.clipboardData?.items || [])].filter((i) => i.kind === 'file' && i.type.startsWith('image/')).map((i) => i.getAsFile());
      if (!files.length) return;
      e.preventDefault();
      files.forEach((f) => { const r = new FileReader(); r.onload = () => { (pasted[key] ||= []).push(r.result); asks[key] = ask.value; renderThread(); $('#ask').focus(); }; r.readAsDataURL(f); });
    });
    if (active && active.id === 'ask') { ask.focus(); ask.setSelectionRange(active.selectionStart, active.selectionEnd); }
  }
  const ta = $('#reply');
  if (ta) {
    ta.addEventListener('input', () => { drafts[key] = ta.value; el.querySelector('[data-a="preview"]').disabled = !ta.value.trim(); });
    ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && ta.value.trim()) { previewing[key] = ta.value.trim(); renderThread(); } });
    if (active && active.id === 'reply') { ta.focus(); ta.setSelectionRange(active.selectionStart, active.selectionEnd); }
  }
}

async function sendAsk() {
  const c = list(src).find((x) => x.id === sel[src]); if (!c) return;
  const key = src + c.id, s = src;
  const text = (asks[key] || '').trim(), images = pasted[key] || [];
  if (!text && !images.length) return;
  const b = document.querySelector('[data-a="ask"]'); if (b) b.disabled = true;
  const r = await fetch(`${BASE}/api/chat/${s}/${c.id}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ text, images }) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) { toast(out.error || 'Not sent. Try again.'); if (b) b.disabled = false; return; }
  delete asks[key]; delete pasted[key];
  lastJson = ''; await load(true);
}

let toastTimer = 0;
function toast(text, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(text)}</span>${undo ? '<button type="button">Undo</button>' : ''}`;
  t.hidden = false;
  if (undo) t.querySelector('button').onclick = () => { t.hidden = true; undo(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
}

async function act(id, action, text) {
  const r = await fetch(`${BASE}/api/comment/${src}/${id}`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, text }) });
  const out = await r.json().catch(() => ({}));
  if (!r.ok) { toast(out.error || 'That did not go through. Try again.'); return false; }
  lastJson = ''; await load(true);
  return true;
}

document.addEventListener('click', async (e) => {
  const tab = e.target.closest('.tab');
  if (tab) { src = tab.dataset.src; saveView(); render(); return; }
  const chip = e.target.closest('.chip');
  if (chip) { filter = chip.dataset.f; saveView(); render(); return; }
  const item = e.target.closest('.item');
  if (item) { sel[src] = Number(item.dataset.id); saveView(); $('#main').classList.add('reading'); render(); return; }
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const c = list(src).find((x) => x.id === sel[src]); if (!c && b.dataset.a !== 'back' && b.dataset.a !== 'pop') return;
  const key = c ? src + c.id : '';
  const s = src;
  switch (b.dataset.a) {
    case 'back': $('#main').classList.remove('reading'); break;
    case 'ask': sendAsk(); break;
    case 'unpaste': (pasted[key] || []).splice(Number(b.dataset.i), 1); renderThread(); break;
    case 'pop': split = !split; try { localStorage.setItem('desk.split', split ? '1' : '0'); } catch {} renderThread(); break;
    case 'preview': previewing[key] = (drafts[key] || '').trim(); renderThread(); break;
    case 'edit': delete previewing[key]; renderThread(); setTimeout(() => $('#reply') && $('#reply').focus(), 0); break;
    case 'send': b.disabled = true; if (await act(c.id, 'reply', previewing[key])) { delete previewing[key]; delete drafts[key]; toast(srcOf(s).audience ? `Sent to ${srcOf(s).audience} on #${c.id}` : `Reply added to #${c.id}`); } else b.disabled = false; break;
    case 'resolve': if (await act(c.id, 'resolve')) toast(`Resolved #${c.id}`, () => { src = s; act(c.id, 'reopen'); }); break;
    case 'reopen': if (await act(c.id, 'reopen')) toast(`Reopened #${c.id}`); break;
  }
});
document.addEventListener('keydown', (e) => {
  if (e.target.closest('textarea')) return;
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  const items = [...document.querySelectorAll('.item')]; if (!items.length) return;
  const i = items.findIndex((x) => Number(x.dataset.id) === sel[src]);
  const n = items[Math.max(0, Math.min(items.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))];
  e.preventDefault(); sel[src] = Number(n.dataset.id); saveView(); render(); n.focus && document.querySelector(`.item[data-id="${n.dataset.id}"]`).scrollIntoView({ block: 'nearest' });
});

// a link straight to a card: …/#staging-27 opens that comment (the Telegram messages link here)
function openFromHash() {
  const m = /^#([\w-]+)-(\d+)$/.exec(location.hash);
  if (!m) return;
  src = m[1]; sel[src] = Number(m[2]); filter = 'all';
  $('#main').classList.add('reading');
  history.replaceState(null, '', location.pathname + location.search);
}
openFromHash();
window.addEventListener('hashchange', () => { openFromHash(); if (data) render(); });
load(true);
setInterval(() => { if (document.visibilityState === 'visible') load(); }, 5000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });

/* ---------- Gallery: the pictures of the open workbench (shots and chat images), in DOM order. */
(() => {
  const gal = document.createElement('div');
  gal.className = 'gal'; gal.hidden = true; gal.setAttribute('role', 'dialog'); gal.setAttribute('aria-label', 'Pictures');
  gal.innerHTML = '<div class="gal-top"><b class="gal-n"></b><span class="gal-from"></span><span class="sp"></span><a class="gal-open" target="_blank"><button type="button">Open original ↗</button></a><button type="button" class="gal-x">Close · Esc</button></div><div class="gal-stage"><button type="button" class="gal-nav prev" aria-label="Previous">←</button><img alt=""><button type="button" class="gal-nav next" aria-label="Next">→</button></div><div><div class="gal-cap"></div><div class="gal-strip"></div></div>';
  document.body.appendChild(gal);
  let items = [], at = 0;
  const caption = (im) => {
    const shot = im.closest('.shots a'); if (shot) return shot.querySelector('small')?.textContent || 'Screenshot';
    const msg = im.closest('.cmsg'); if (msg) return (msg.querySelector('p')?.textContent || '').trim() || msg.querySelector('.by')?.textContent || '';
    return im.alt || '';
  };
  const from = (im) => im.closest('.cmsg')?.querySelector('.by')?.textContent || '';
  const show = (i) => {
    at = (i + items.length) % items.length; const it = items[at];
    gal.querySelector('.gal-stage img').src = it.src;
    gal.querySelector('.gal-n').textContent = `${at + 1} / ${items.length}`;
    gal.querySelector('.gal-from').textContent = it.from;
    gal.querySelector('.gal-cap').textContent = it.cap;
    gal.querySelector('.gal-open').href = it.src;
    gal.querySelectorAll('.gal-strip img').forEach((t, j) => t.setAttribute('aria-current', String(j === at)));
    gal.querySelectorAll('.gal-nav').forEach((b) => (b.hidden = items.length < 2));
  };
  const open = (bench, target) => {
    const imgs = [...bench.querySelectorAll('img')].filter((im) => !im.closest('.ask'));
    items = imgs.map((im) => ({ src: im.currentSrc || im.src, cap: caption(im), from: from(im) }));
    gal.querySelector('.gal-strip').innerHTML = items.map((it, j) => `<img src="${esc(it.src)}" alt="" data-j="${j}">`).join('');
    gal.hidden = false; show(Math.max(0, imgs.indexOf(target)));
  };
  const close = () => { gal.hidden = true; };
  document.addEventListener('click', (e) => {
    const im = e.target.closest && e.target.closest('.bench img');
    if (im && !im.closest('.ask')) { e.preventDefault(); e.stopImmediatePropagation(); open(im.closest('.bench'), im); }
  }, true);
  gal.addEventListener('click', (e) => {
    if (e.target.closest('.gal-x') || e.target === gal.querySelector('.gal-stage')) return close();
    if (e.target.closest('.prev')) return show(at - 1);
    if (e.target.closest('.next')) return show(at + 1);
    const t = e.target.closest('.gal-strip img'); if (t) show(Number(t.dataset.j));
  });
  document.addEventListener('keydown', (e) => {
    if (gal.hidden) return;
    if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') show(at - 1); else if (e.key === 'ArrowRight') show(at + 1); else return;
    e.preventDefault(); e.stopImmediatePropagation();
  }, true);
})();
</script>
